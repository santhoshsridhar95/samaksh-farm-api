spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}

app.security.jwt.secret=${JWT_SECRET}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.auth.email-verification.base-url=${EMAIL_VERIFICATION_BASE_URL}
app.keep-awake.enabled=${KEEP_AWAKE_ENABLED:true}
app.keep-awake.interval-minutes=${KEEP_AWAKE_INTERVAL_MINUTES:10}
app.keep-awake.target-url=${KEEP_AWAKE_TARGET_URL:}
app.keep-awake.render-external-url=${RENDER_EXTERNAL_URL:}

server.error.include-message=never
server.error.include-binding-errors=never
