spring.application.name=samkash-farm-api

spring.profiles.default=dev

server.port=${PORT:8080}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.show-sql=${JPA_SHOW_SQL:false}

spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}

app.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

app.bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap.admin.name=${BOOTSTRAP_ADMIN_NAME:Samaksh Farms Admin}

app.mail.enabled=${MAIL_ENABLED:false}
app.google.client-id=${GOOGLE_CLIENT_ID:}

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:25}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
