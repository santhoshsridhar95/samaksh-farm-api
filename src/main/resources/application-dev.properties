spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/samaksh_farms_dev}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}

app.security.jwt.secret=${JWT_SECRET:samaksh-farms-local-development-jwt-secret-change-before-prod}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5175,capacitor://localhost,http://localhost}
app.auth.email-verification.base-url=${EMAIL_VERIFICATION_BASE_URL:http://localhost:5173/verify-email}
