name: Keep Render API Awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping-render:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping configured Render health URLs
        env:
          RENDER_API_HEALTH_URL: ${{ vars.RENDER_API_HEALTH_URL || secrets.RENDER_API_HEALTH_URL }}
          RENDER_DEV_API_HEALTH_URL: ${{ vars.RENDER_DEV_API_HEALTH_URL || secrets.RENDER_DEV_API_HEALTH_URL }}
          RENDER_PROD_API_HEALTH_URL: ${{ vars.RENDER_PROD_API_HEALTH_URL || secrets.RENDER_PROD_API_HEALTH_URL }}
        run: |
          set -euo pipefail

          ping_url() {
            local name="$1"
            local url="$2"

            if [ -z "$url" ]; then
              echo "Skipping $name: no URL configured"
              return 0
            fi

            echo "Pinging $name"
            curl --fail --silent --show-error --location \
              --connect-timeout 20 \
              --max-time 60 \
              --retry 3 \
              --retry-delay 10 \
              --retry-all-errors \
              "$url" > /dev/null
          }

          ping_url "default Render API" "$RENDER_API_HEALTH_URL"
          ping_url "dev Render API" "$RENDER_DEV_API_HEALTH_URL"
          ping_url "prod Render API" "$RENDER_PROD_API_HEALTH_URL"
